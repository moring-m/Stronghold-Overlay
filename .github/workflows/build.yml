name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
          pip install --no-deps -r requirements-ocr.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build
        run: pyinstaller --noconfirm StrongholdOverlay.spec
      - name: Self-test packaged app
        shell: pwsh
        run: |
          $p = Start-Process dist/StrongholdOverlay/StrongholdOverlay.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Size report
        shell: pwsh
        run: |
          $d = "dist/StrongholdOverlay"
          "{0:N1} MB total" -f ((Get-ChildItem $d -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem "$d/_internal" | ForEach-Object {
            $s = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse | Measure-Object Length -Sum).Sum } else { $_.Length }
            [pscustomobject]@{ MB = [math]::Round($s / 1MB, 1); Name = $_.Name } } | Sort-Object MB -Descending | Select-Object -First 15 | Format-Table -AutoSize
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/StrongholdOverlay -DestinationPath StrongholdOverlay-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StrongholdOverlay-win64
          path: StrongholdOverlay-win64.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StrongholdOverlay-win64.zip
